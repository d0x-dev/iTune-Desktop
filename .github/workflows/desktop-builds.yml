name: Build iTune Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            build_command: npm run electron:windows
            artifact_path: release/*.exe
          - platform: macos-x64-arm64
            runner: macos-latest
            build_command: npm run electron:mac
            artifact_path: |
              release/*.dmg
              release/*.zip
          - platform: linux-x64
            runner: ubuntu-latest
            build_command: npm run electron:linux
            artifact_path: |
              release/*.AppImage
              release/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
