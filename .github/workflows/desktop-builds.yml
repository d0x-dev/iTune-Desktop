name: Build iTune Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            build_command: npm run electron:windows
            artifact_path: release/*.exe
          - platform: macos-x64-arm64
            runner: macos-latest
            build_command: npm run electron:mac
            artifact_path: |
              release/*.dmg
              release/*.zip
          - platform: linux-x64
            runner: ubuntu-latest
            build_command: npm run electron:linux
            artifact_path: |
              release/*.AppImage
              release/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop packages
        run: ${{ matrix.build_command }}

      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: iTune-Desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish the first cross-platform release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: iTune-Desktop-*
          path: release-assets
          merge-multiple: true

      - name: Attach packages and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-assets/*)
          if [ "${#files[@]}" -lt 6 ]; then
            printf 'Expected six Windows, macOS, and Linux packages, found %s.\n' "${#files[@]}" >&2
            exit 1
          fi
          notes=$(cat <<'EOF'
