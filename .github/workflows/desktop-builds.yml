name: Build iTune Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            build_command: npm run electron:windows
            artifact_path: release/*.exe
          - platform: macos-x64-arm64
            runner: macos-latest
            build_command: npm run electron:mac
            artifact_path: |
              release/*.dmg
              release/*.zip
          - platform: linux-x64
            runner: ubuntu-latest
            build_command: npm run electron:linux
            artifact_path: |
              release/*.AppImage
              release/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop packages
        run: ${{ matrix.build_command }}

      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: iTune-Desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish the first cross-platform release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: iTune-Desktop-*
          path: release-assets
          merge-multiple: true

      - name: Attach packages and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-assets/*)
          if [ "${#files[@]}" -lt 6 ]; then
            printf 'Expected six Windows, macOS, and Linux packages, found %s.\n' "${#files[@]}" >&2
            exit 1
          fi
          notes=$(cat <<'EOF'
          <img width="1672" height="941" alt="iTune Desktop screenshot" src="https://github.com/user-attachments/assets/faad570e-b0c8-4234-b106-049e9ab6a354" />

          # iTune Desktop 1.0.0

          The first cross-platform iTune Desktop release brings your YouTube Music library, playback, lyrics, playlists, radio, and desktop audio controls to Windows, macOS, and Linux.

          ## What’s new

          - Added an Android-style About panel with installed build details, GitHub release notes, update downloads, and every available platform package.
          - Added automatic release checks and in-app downloads for Windows, macOS, and Linux.
          - Added Windows setup and portable apps, macOS DMG and ZIP packages, and Linux AppImage and DEB packages.
          - Improved playback when the app is minimized and brought the desktop Settings and About details in line with iTune for Android.

          ## Downloads

          Choose the package for your operating system. Windows offers an installer and a portable executable, macOS includes DMG and ZIP builds, and Linux includes AppImage and DEB builds.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "iTune Desktop $GITHUB_REF_NAME" \
            --notes "$notes"


