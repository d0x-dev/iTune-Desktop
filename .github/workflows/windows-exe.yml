name: Build iTune Desktop (Windows EXE)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable Windows executable
        run: npm run electron:portable

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: iTune-Desktop-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
